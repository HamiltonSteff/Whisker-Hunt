<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Whisker Hunt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8e6f6;
  --card:#f7f6fd;
  --card-edge:#d3cfea;
  --ink:#231a3b;
  --muted:#6a6389;
  --accent:#6247f5;
  --accent-ink:#ffffff;
  --heart:#ff4d6d;
  --gridink:#231a3b;
  --thin:rgba(35,26,59,.22);
  --frame-ring:rgba(35,26,59,.10);
  --shadow:0 10px 28px rgba(45,30,90,.16);
  --scrim:rgba(24,16,44,.55);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14101f;
    --card:#211a33;
    --card-edge:#372d52;
    --ink:#f2edff;
    --muted:#a99ec4;
    --accent:#9382ff;
    --accent-ink:#140e25;
    --heart:#ff6b86;
    --gridink:#0d0917;
    --thin:rgba(13,9,23,.35);
    --frame-ring:rgba(255,255,255,.16);
    --shadow:0 10px 28px rgba(0,0,0,.45);
    --scrim:rgba(6,3,14,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#14101f;
  --card:#211a33;
  --card-edge:#372d52;
  --ink:#f2edff;
  --muted:#a99ec4;
  --accent:#9382ff;
  --accent-ink:#140e25;
  --heart:#ff6b86;
  --gridink:#0d0917;
  --thin:rgba(13,9,23,.35);
  --frame-ring:rgba(255,255,255,.16);
  --shadow:0 10px 28px rgba(0,0,0,.45);
  --scrim:rgba(6,3,14,.7);
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Fredoka',ui-rounded,'SF Pro Rounded','Hiragino Maru Gothic ProN',system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
  touch-action:manipulation;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;cursor:pointer}
svg{display:block}

.app{
  max-width:480px;margin:0 auto;
  min-height:100dvh;
  padding:max(12px,env(safe-area-inset-top)) 14px max(20px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:12px;
}

/* header */
.top{display:grid;grid-template-columns:auto 1fr 48px;align-items:center;gap:8px}
.top-left{display:flex;gap:6px}
.top-left .icon-btn{width:44px;height:44px;border-radius:14px}
.top-left .icon-btn svg{width:21px;height:21px}
.icon-btn{
  width:48px;height:48px;border-radius:16px;flex:none;
  background:var(--card);border:2px solid var(--card-edge);
  display:grid;place-items:center;padding:0;
}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:24px;height:24px}
.title{text-align:center;line-height:1.05}
.title h1{margin:0;font-size:30px;font-weight:700;letter-spacing:.2px}
.title p{margin:3px 0 0;font-size:14px;color:var(--muted);font-weight:500}

/* status */
.status{display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.lives{display:flex;gap:6px}
.lives svg{width:30px;height:30px;overflow:visible}
.lives .heart path{fill:var(--heart);stroke:var(--heart);stroke-width:1.6;stroke-linejoin:round;transition:fill .2s}
.lives .heart.lost path{fill:none;stroke:var(--muted);opacity:.55}
.lives .heart.lost{animation:heartpop .5s ease}
@keyframes heartpop{0%{transform:scale(1)}30%{transform:scale(1.35) rotate(-8deg)}100%{transform:scale(1)}}
.count{font-size:22px;font-weight:600}
.count small{font-size:14px;color:var(--muted);font-weight:500;margin-right:6px}

/* tracker */
.tracker{
  background:var(--card);border:2px solid var(--card-edge);border-radius:20px;
  padding:12px;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,42px));gap:7px;justify-content:center;
}
.chip{
  position:relative;width:100%;aspect-ratio:1/1;border-radius:11px;
  background-color:var(--c);border:2.5px solid var(--gridink);
  display:grid;place-items:center;
  opacity:.5;transition:opacity .25s;
}
.chip .ico{display:block;width:76%;height:76%;opacity:.28}
.chip .ico svg{width:100%;height:100%}
.chip .tick{
  position:absolute;right:-5px;bottom:-5px;width:44%;min-width:13px;aspect-ratio:1/1;border-radius:50%;
  background:var(--accent);color:var(--accent-ink);border:2px solid var(--card);
  display:none;place-items:center;
}
.chip .tick svg{width:62%;height:62%}
.chip.found{opacity:1}
.chip.found .ico{opacity:1}
.chip.found .tick{display:grid}
.chip.found.new{animation:chipjump .5s ease}
@keyframes chipjump{0%{transform:translateY(0)}35%{transform:translateY(-8px) rotate(-6deg)}70%{transform:translateY(0) rotate(3deg)}100%{transform:none}}

/* board */
.board-wrap{
  width:100%;aspect-ratio:1/1;overflow:auto;border-radius:18px;
  box-shadow:0 0 0 1px var(--frame-ring),var(--shadow);
  background:var(--gridink);
  scrollbar-width:none;overscroll-behavior:contain;
}
.board-wrap::-webkit-scrollbar{display:none}
.board{
  width:calc(100% * var(--zoom,1));aspect-ratio:1/1;
  display:grid;
  grid-template-columns:repeat(var(--n),minmax(0,1fr));
  grid-template-rows:repeat(var(--n),minmax(0,1fr));
  border:3px solid var(--gridink);
  border-radius:18px;overflow:hidden;
  background:var(--gridink);
}
.cell{
  position:relative;min-width:0;min-height:0;
  background-color:var(--c);
  display:grid;place-items:center;
  border-top:1px solid var(--thin);
  border-left:1px solid var(--thin);
  cursor:pointer;
}
.cell.t0{border-top:0}
.cell.l0{border-left:0}
.cell.tk{border-top:var(--tk,3px) solid var(--gridink)}
.cell.lk{border-left:var(--tk,3px) solid var(--gridink)}
.cell:focus-visible{outline:3px solid #fff;outline-offset:-5px}
@media (hover:hover){.cell:hover{filter:brightness(1.07)}}
.cell:active{filter:brightness(1.12)}
.cell[data-s="c"],.cell[data-s="r"],.cell[data-s="g"]{cursor:default}
.board.locked .cell{cursor:default}
.cell .ico{width:64%;height:64%;display:grid;place-items:center}
.cell .ico svg{width:100%;height:100%;overflow:visible}
.cell[data-s="x"] .ico{width:58%;height:58%}
.cell[data-s="r"] .ico{width:66%;height:66%;animation:shake .4s ease}
.cell[data-s="g"] .ico{opacity:.42}
.ico.pop{animation:pop .42s cubic-bezier(.2,1.4,.4,1)}
.ico.hop{animation:hop .55s ease both}
@keyframes pop{0%{transform:scale(.2) rotate(-14deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes hop{0%,100%{transform:none}40%{transform:translateY(-22%) rotate(-6deg)}70%{transform:translateY(0) rotate(3deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-14%)}40%{transform:translateX(12%)}60%{transform:translateX(-8%)}80%{transform:translateX(5%)}}

/* how to */
.how{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.how div{
  display:flex;align-items:center;gap:10px;
  background:var(--card);border:2px solid var(--card-edge);border-radius:16px;
  padding:8px 10px;font-size:14px;font-weight:500;line-height:1.15;color:var(--muted);
}
.how b{color:var(--ink);font-weight:600;display:block}
.how .mini{flex:none;width:34px;height:34px;border-radius:10px;background:#f4c44e;display:grid;place-items:center;border:2px solid var(--gridink)}
.how .mini svg{width:70%;height:70%}

/* footer */
.foot{display:flex;gap:10px;margin-top:auto}
.btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;padding:0 14px;border-radius:16px;
  background:var(--card);border:2px solid var(--card-edge);
  font-size:16px;font-weight:600;
}
.btn:active{transform:scale(.97)}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.switch{width:38px;height:22px;border-radius:99px;background:var(--card-edge);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--ink);transition:transform .2s,background .2s}
.btn[aria-pressed="true"] .switch{background:var(--accent)}
.btn[aria-pressed="true"] .switch::after{transform:translateX(16px);background:var(--accent-ink)}

/* modal */
.scrim{position:fixed;inset:0;background:var(--scrim);display:none;place-items:center;padding:16px;z-index:10}
.scrim.open{display:grid}
.sheet{
  width:100%;max-width:380px;max-height:86dvh;overflow:auto;
  background:var(--card);border:2px solid var(--card-edge);border-radius:26px;
  padding:22px 20px 20px;box-shadow:var(--shadow);text-align:center;
  animation:sheetin .28s cubic-bezier(.2,1.2,.4,1);
}
@keyframes sheetin{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 6px;font-size:32px;font-weight:700;line-height:1.05}
.sheet p{margin:0 0 14px;color:var(--muted);font-size:17px;line-height:1.3}
.sheet .big-cat{width:84px;height:84px;margin:0 auto 8px;background:var(--c,#f4c44e);border:3px solid var(--gridink);border-radius:24px;display:grid;place-items:center}
.sheet .big-cat svg{width:70%;height:70%}
.sheet .stack{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.sheet .row-hearts{display:flex;gap:6px;justify-content:center;margin:0 0 14px}
.sheet .row-hearts svg{width:26px;height:26px}
.sheet .row-hearts .heart path{fill:var(--heart);stroke:var(--heart);stroke-width:1.6;stroke-linejoin:round}
.sheet .row-hearts .heart.lost path{fill:none;stroke:var(--muted);opacity:.55}
.rules{list-style:none;margin:0 0 16px;padding:0;text-align:left;display:flex;flex-direction:column;gap:12px}
.rules li{display:flex;gap:12px;align-items:center;font-size:17px;line-height:1.25}
.rules .mini{flex:none;width:38px;height:38px;border-radius:11px;background:#78c47a;border:2.5px solid var(--gridink);display:grid;place-items:center}
.rules .mini svg{width:72%;height:72%}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.lv{
  position:relative;padding:8px 0 7px;border-radius:14px;background:var(--bg);
  border:2px solid var(--card-edge);display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.1;
}
.lv b{font-size:22px;font-weight:600}
.lv small{font-size:12px;color:var(--muted);font-weight:500}
.lv.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.lv.done{background:var(--card)}
.lv .ok{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;border:2px solid var(--card)}
.lv .ok svg{width:11px;height:11px}
.lv .mh{display:flex;gap:2px;margin-top:3px;height:9px}
.lv .mh svg{width:9px;height:9px}
.lv .mh path{fill:var(--heart);stroke:none}
.lv .mh .lost path{fill:var(--card-edge)}

.board-frame{position:relative;width:100%}
.edge{position:absolute;width:34px;height:34px;border-radius:50%;background:rgba(35,26,59,.8);color:#fff;border:2px solid rgba(255,255,255,.9);display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .2s;box-shadow:0 2px 8px rgba(0,0,0,.35);z-index:2}
.edge svg{width:18px;height:18px}
.edge.show{opacity:1}
.edge.up{top:8px;left:50%;margin-left:-17px}
.edge.down{bottom:8px;left:50%;margin-left:-17px}
.edge.left{left:8px;top:50%;margin-top:-17px}
.edge.right{right:8px;top:50%;margin-top:-17px}
.edge.show.up{animation:nudgeUp 1.6s ease-in-out infinite}
.edge.show.down{animation:nudgeDown 1.6s ease-in-out infinite}
.edge.show.left{animation:nudgeLeft 1.6s ease-in-out infinite}
.edge.show.right{animation:nudgeRight 1.6s ease-in-out infinite}
@keyframes nudgeUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes nudgeDown{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
@keyframes nudgeLeft{0%,100%{transform:translateX(0)}50%{transform:translateX(-4px)}}
@keyframes nudgeRight{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
.p1{background-image:radial-gradient(circle at 50% 50%,rgba(35,26,59,.3) 0 15%,transparent 18%);background-size:50% 50%}
.p2{background-image:linear-gradient(135deg,rgba(255,255,255,.4) 25%,transparent 25% 50%,rgba(255,255,255,.4) 50% 75%,transparent 75%);background-size:50% 50%}
.btn[hidden]{display:none}
.btn{white-space:nowrap}
.foot .btn{font-size:15px;gap:6px;padding:0 10px}
.foot .btn svg{width:18px;height:18px}
.btn.zoom{flex:0 0 auto;min-width:78px}
.icon-btn:disabled{opacity:.35;cursor:default}
.pager{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.pager span{font-size:19px;font-weight:600}
.pager .icon-btn{width:44px;height:44px;border-radius:14px}
.spin{width:54px;height:54px;margin:0 auto 14px;border-radius:50%;border:5px solid var(--card-edge);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:360px){
  .title h1{font-size:26px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-left">
    <button class="icon-btn" id="btnLevels" aria-label="Choose level">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
    </button>
    <button class="icon-btn" id="btnMusic" aria-label="Turn music on" aria-pressed="false">
      <span id="musicIcon"></span>
    </button>
    <button class="icon-btn" id="btnSfx" aria-label="Turn sound effects on" aria-pressed="false">
      <span id="sfxIcon"></span>
    </button>
    </div>
    <div class="title"><h1 id="lvTitle">Level 1</h1><p id="lvSub">4 × 4 grid</p></div>
    <button class="icon-btn" id="btnHelp" aria-label="How to play">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.6 2.2c-.8.4-1.2 1-1.2 1.8"/><path d="M12 16.9v.1"/></svg>
    </button>
  </header>

  <section class="status" aria-label="Lives and progress">
    <div class="lives" id="lives" aria-live="polite"></div>
    <div class="count" id="count" aria-live="polite"></div>
  </section>

  <section class="tracker" id="tracker" aria-label="Cat colours found"></section>

  <div class="board-frame"><section class="board-wrap" id="boardWrap"><main class="board" id="board" role="grid" aria-label="Cat grid"></main></section><span class="edge up" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></span><span class="edge down" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span><span class="edge left" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></span><span class="edge right" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span></div>

  <section class="how" aria-label="Controls">
    <div><span class="mini" id="miniX"></span><span><b>Tap</b>mark empty</span></div>
    <div><span class="mini" id="miniCat"></span><span><b>Double-tap</b>place cat</span></div>
  </section>

  <footer class="foot">
    <button class="btn" id="btnRestart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v4.5h4.5"/></svg>
      <span id="restartLabel">Restart</span>
    </button>
    <button class="btn" id="btnAuto" aria-pressed="false">
      <span>Auto ✕</span><span class="switch"></span>
    </button>
    <button class="btn zoom" id="btnZoom" hidden aria-label="Zoom the board">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21M8 10.5h5M10.5 8v5"/></svg>
      <span id="zoomLabel">1×</span>
    </button>
  </footer>
</div>

<div class="scrim" id="scrim"></div>

<script>
/* ---------- level data (n x n grid, region ids per cell, cat column per row) ---------- */

let save = { done: {}, seenHelp: false, auto: false, level: 0 };
try {
  const raw = localStorage.getItem(STORE_KEY);
  if (raw) { const p = JSON.parse(raw); if (p && typeof p === 'object') save = Object.assign(save, p); }
} catch (e) {}
function persist() { try { localStorage.setItem(STORE_KEY, JSON.stringify(save)); } catch (e) {} }

/* ---------- game state ---------- */
const $ = (s) => document.querySelector(s);
const board = $('#board'), tracker = $('#tracker'), livesEl = $('#lives'), countEl = $('#count'), scrim = $('#scrim');

let G = null;          // current level state
let lastTap = { i: -1, t: 0, prev: 'e' };
let winTimer = 0, restartTimer = 0, loadTimer = 0;
const ZOOMS = [1, 1.8, 2.6];

/* ---------- where levels come from ---------- */
const BANK_MIN = 16;
const PAGE = 20;
const GEN_KEY = 'whisker-hunt-gen-v1';
let genStore = { order: [], data: {} };
try {
  const raw = localStorage.getItem(GEN_KEY);
  if (raw) { const p = JSON.parse(raw); if (p && Array.isArray(p.order) && p.data) genStore = p; }
} catch (e) {}
function persistGen() { try { localStorage.setItem(GEN_KEY, JSON.stringify(genStore)); } catch (e) {} }
const b36 = (a) => a.map((x) => x.toString(36)).join('');
const unb36 = (s) => [...s].map((ch) => parseInt(ch, 36));

/* every territory must be one connected piece (edge to edge) */
function contiguous(n, reg) {
  const nb = getGeom(n).nb4;
  for (let g = 0; g < n; g++) {
    const start = reg.indexOf(g);
    if (start < 0) return false;
    let total = 0; for (let i = 0; i < reg.length; i++) if (reg[i] === g) total++;
    const seen = new Set([start]), st = [start];
    while (st.length) { const x = st.pop(); for (const y of nb[x]) if (reg[y] === g && !seen.has(y)) { seen.add(y); st.push(y); } }
    if (seen.size !== total) return false;
  }
  return true;
}

function levelSize(idx) { return idx < LEVELS.length ? LEVELS[idx].n : sizeFor(idx); }

/* a pre-built big puzzle, flipped/rotated and recoloured differently for each level number */
function fromBank(idx, n) {
  const list = BANK[n];
  const rnd = mulberry32(seedFor(idx, 7));
  const p = list[Math.floor(rnd() * list.length)];
  const t = Math.floor(rnd() * 8);
  const perm = shuffleArr([...Array(n).keys()], rnd);
  const reg = unb36(p.reg), sol = unb36(p.sol);
  const m = n - 1;
  const map = (r, c) => [[r, c], [r, m - c], [m - r, c], [m - r, m - c], [c, r], [c, m - r], [m - c, r], [m - c, m - r]][t];
  const reg2 = new Array(n * n), sol2 = new Array(n);
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) { const q = map(r, c); reg2[q[0] * n + q[1]] = perm[reg[r * n + c]]; }
  sol.forEach((c, r) => { const q = map(r, c); sol2[q[0]] = q[1]; });
  return { n, reg: b36(reg2), sol: b36(sol2) };
}

function getLevel(idx) {
  if (idx < LEVELS.length) return LEVELS[idx];
  if (genStore.data[idx]) return genStore.data[idx];
  const n = sizeFor(idx);
  if (n >= BANK_MIN && BANK[n] && BANK[n].length) return fromBank(idx, n);
  return null;
}

/* on-device generation, run in small slices so the page stays responsive */
const jobs = {};
let wanted = null, ahead = null, pumpOn = false;
function pump() { if (pumpOn) return; pumpOn = true; setTimeout(step, 0); }
function step() {
  const urgent = wanted !== null && !getLevel(wanted);
  let idx = null;
  if (urgent) idx = wanted; else if (ahead !== null && !getLevel(ahead)) idx = ahead;
  if (idx === null) { pumpOn = false; return; }
  let job = jobs[idx];
  if (!job) { const n = sizeFor(idx); job = jobs[idx] = { salt: 0, gen: genPuzzle(n, seedFor(idx), optsFor(n)) }; }
  const t0 = performance.now(), budget = urgent ? 40 : 8;
  let finished = false, res = null;
  while (performance.now() - t0 < budget) {
    const r = job.gen.next();
    if (r.done) { finished = true; res = r.value; break; }
  }
  if (finished) {
    if (res && !contiguous(res.n, res.reg)) res = null;
    if (!res) { const n = sizeFor(idx); job.salt++; job.gen = genPuzzle(n, seedFor(idx, job.salt), optsFor(n)); }
    else {
      delete jobs[idx];
      genStore.data[idx] = { n: res.n, reg: b36(res.reg), sol: b36(res.sol) };
      genStore.order.push(idx);
      while (genStore.order.length > 60) delete genStore.data[genStore.order.shift()];
      persistGen();
      if (wanted === idx) { const w = wanted; wanted = null; startLevel(w, getLevel(w)); }
    }
  }
  setTimeout(step, urgent ? 0 : 40);
}

function loadLevel(idx) {
  idx = Math.max(0, idx);
  const L = getLevel(idx);
  clearTimeout(loadTimer);
  if (L) { wanted = null; startLevel(idx, L); return; }
  wanted = idx;
  loadTimer = setTimeout(() => { if (wanted === idx) showLoading(idx); }, 250);
  pump();
}

function showLoading(idx) {
  const n = levelSize(idx);
  openModal('<div class="spin"></div><h2>Hiding the cats</h2><p>Building a ' + n + ' × ' + n + ' grid for level ' + (idx + 1) + '.</p>' +
    '<div class="stack"><button class="btn" data-act="cancelload">Cancel</button></div>');
}

function startLevel(idx, L) {
  clearTimeout(winTimer); clearTimeout(loadTimer); clearTimeout(restartTimer);
  restartTimer = 0; $('#restartLabel').textContent = 'Restart';
  const n = L.n;
  const reg = unb36(L.reg);
  const cat = new Array(n).fill(0);            // cell index of each region's cat
  const solCells = new Set();
  unb36(L.sol).forEach((c, r) => { const i = r * n + c; solCells.add(i); cat[reg[i]] = i; });
  const pal = assignColors(n, reg);
  G = { idx, n, reg, cat, solCells, colors: pal.colors, pats: pal.pats, zoom: n >= 16 ? 1 : 0,
        cells: new Array(n * n).fill('e'), lives: MAX_LIVES, found: new Set(), over: false, won: false };
  lastTap = { i: -1, t: 0, prev: 'e' };
  save.level = idx; persist();
  $('#lvTitle').textContent = 'Level ' + (idx + 1);
  $('#lvSub').textContent = n + ' × ' + n + ' grid';
  $('#btnZoom').hidden = n < 11;
  buildBoard(); renderTracker(); renderLives(); renderCount(); applyZoom(true);
  board.classList.remove('locked');
  closeModal();
  ahead = idx + 1;
  if (!getLevel(ahead)) pump();
}

function applyZoom(reset) {
  const wrap = $('#boardWrap'), z = ZOOMS[G.zoom];
  let cx = 0.5, cy = 0.5;
  if (!reset && board.offsetWidth) {
    cx = (wrap.scrollLeft + wrap.clientWidth / 2) / board.offsetWidth;
    cy = (wrap.scrollTop + wrap.clientHeight / 2) / board.offsetHeight;
  }
  board.style.setProperty('--zoom', z);
  $('#zoomLabel').textContent = z + '×';
  wrap.scrollLeft = cx * board.offsetWidth - wrap.clientWidth / 2;
  wrap.scrollTop = cy * board.offsetHeight - wrap.clientHeight / 2;
  updateEdges();
}

/* arrows on the edges of the board show where more squares are hidden out of view */
function updateEdges() {
  const w = $('#boardWrap'), t = 4;
  const more = {
    left: w.scrollLeft > t,
    right: w.scrollLeft + w.clientWidth < w.scrollWidth - t,
    up: w.scrollTop > t,
    down: w.scrollTop + w.clientHeight < w.scrollHeight - t
  };
  for (const k in more) $('.edge.' + k).classList.toggle('show', more[k]);
}

function buildBoard() {
  const { n, reg } = G;
  board.style.setProperty('--n', n);
  board.style.setProperty('--tk', n > 12 ? '2px' : '3px');
  board.innerHTML = '';
  const frag = document.createDocumentFragment();
  for (let i = 0; i < n * n; i++) {
    const r = Math.floor(i / n), c = i % n;
    const d = document.createElement('div');
    let cls = 'cell';
    if (r === 0) cls += ' t0'; else if (reg[i] !== reg[i - n]) cls += ' tk';
    if (c === 0) cls += ' l0'; else if (reg[i] !== reg[i - 1]) cls += ' lk';
    d.className = cls + (G.pats[reg[i]] ? ' p' + G.pats[reg[i]] : '');
    d.dataset.i = i; d.dataset.s = 'e';
    d.style.setProperty('--c', G.colors[reg[i]]);
    d.setAttribute('role', 'gridcell');
    d.setAttribute('tabindex', '0');
    d.setAttribute('aria-label', 'Row ' + (r + 1) + ', column ' + (c + 1));
    frag.appendChild(d);
  }
  board.appendChild(frag);
}

function renderCell(i, anim) {
  const el = board.children[i];
  const s = G.cells[i];
  el.dataset.s = s;
  let h = '';
  if (s === 'x') h = '<span class="ico">' + ICON.x + '</span>';
  else if (s === 'r') h = '<span class="ico">' + ICON.red + '</span>';
  else if (s === 'c') h = '<span class="ico' + (anim ? ' pop' : '') + '">' + ICON.cat + '</span>';
  else if (s === 'g') h = '<span class="ico">' + ICON.cat + '</span>';
  el.innerHTML = h;
}

function renderTracker(newRegion) {
  tracker.innerHTML = '';
  tracker.style.setProperty('--cols', G.n <= 8 ? G.n : Math.ceil(G.n / 2));
  for (let g = 0; g < G.n; g++) {
    const f = G.found.has(g);
    const d = document.createElement('div');
    d.className = 'chip' + (f ? ' found' : '') + (f && g === newRegion ? ' new' : '') + (G.pats[g] ? ' p' + G.pats[g] : '');
    d.style.setProperty('--c', G.colors[g]);
    d.setAttribute('aria-label', 'Colour ' + (g + 1) + (f ? ': cat found' : ': cat not found yet'));
    d.innerHTML = '<span class="ico">' + ICON.cat + '</span><span class="tick">' + ICON.tick + '</span>';
    tracker.appendChild(d);
  }
}

function renderLives(justLost) {
  livesEl.innerHTML = '';
  livesEl.setAttribute('aria-label', G.lives + ' lives left');
  for (let k = 0; k < MAX_LIVES; k++) {
    const lost = k >= G.lives;
    const d = document.createElement('div');
    d.className = 'heart' + (lost ? ' lost' : '');
    if (lost && k !== G.lives) d.style.animation = 'none';   // only animate the heart just lost
    if (lost && !justLost) d.style.animation = 'none';
    d.innerHTML = ICON.heart;
    livesEl.appendChild(d);
  }
}
function renderCount() {
  countEl.innerHTML = '<small>Cats</small>' + G.found.size + ' / ' + G.n;
}

/* ---------- input ---------- */
function onTap(i) {
  if (G.over || G.won) return;
  const s = G.cells[i];
  if (s === 'c' || s === 'r') return;
  const now = performance.now();
  if (lastTap.i === i && now - lastTap.t < DOUBLE_TAP_MS) {
    // second tap of a double-tap: undo the mark toggle from the first tap, then guess
    G.cells[i] = lastTap.prev;
    lastTap = { i: -1, t: 0, prev: 'e' };
    renderCell(i);
    guess(i);
    return;
  }
  lastTap = { i, t: now, prev: s };
  G.cells[i] = s === 'x' ? 'e' : 'x';
  renderCell(i);
}

function guess(i) {
  if (G.solCells.has(i)) {
    G.cells[i] = 'c';
    G.found.add(G.reg[i]);
    if (save.auto) autoMark(i);
    renderCell(i, true);
    renderTracker(G.reg[i]);
    renderCount();
    if (G.found.size === G.n) win();
    else if (sfxOn) meow(sfxTime());
  } else {
    G.cells[i] = 'r';
    G.lives--;
    renderCell(i);
    renderLives(true);
    try { if (navigator.vibrate) navigator.vibrate(60); } catch (e) {}
    if (sfxOn) warnSound(sfxTime());
    if (G.lives <= 0) lose();
  }
}

function autoMark(c) {
  const { n, reg } = G;
  const r = Math.floor(c / n), cc = c % n;
  for (let i = 0; i < n * n; i++) {
    if (i === c || G.cells[i] !== 'e') continue;
    const ri = Math.floor(i / n), ci = i % n;
    if (ri === r || ci === cc || reg[i] === reg[c] || (Math.abs(ri - r) <= 1 && Math.abs(ci - cc) <= 1)) {
      G.cells[i] = 'x'; renderCell(i);
    }
  }
}

board.addEventListener('click', (e) => {
  const c = e.target.closest('.cell');
  if (c) onTap(+c.dataset.i);
});
board.addEventListener('keydown', (e) => {
  const c = e.target.closest('.cell');
  if (!c || G.over || G.won) return;
  const i = +c.dataset.i;
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    const s = G.cells[i];
    if (s === 'c' || s === 'r') return;
    if (e.shiftKey) guess(i); else { G.cells[i] = s === 'x' ? 'e' : 'x'; renderCell(i); }
  }
});

/* ---------- end states ---------- */
function win() {
  G.won = true;
  board.classList.add('locked');
  if (sfxOn) winSound(sfxTime());
  const best = save.done[G.idx] || 0;
  save.done[G.idx] = Math.max(best, G.lives);
  persist();
  let k = 0;
  [...G.cat].sort((a, b) => a - b).forEach((i) => {
    const ico = board.children[i].querySelector('.ico');
    if (ico) { ico.classList.remove('pop'); ico.style.animationDelay = (k++ * 70 + 250) + 'ms'; ico.classList.add('hop'); }
  });
  winTimer = setTimeout(showWin, 1200 + G.n * 60);
}

function lose() {
  G.over = true;
  board.classList.add('locked');
  if (sfxOn) failSound(sfxTime() + 0.3);
  G.cat.forEach((i) => { if (G.cells[i] !== 'c') { G.cells[i] = 'g'; renderCell(i); } });
  winTimer = setTimeout(showLose, 900);
}

function miniHearts(lives) {
  let h = '<div class="row-hearts">';
  for (let k = 0; k < MAX_LIVES; k++) h += '<span class="heart' + (k >= lives ? ' lost' : '') + '">' + ICON.heart + '</span>';
  return h + '</div>';
}

function showWin() {
  openModal(
    '<div class="big-cat" style="--c:' + G.colors[0] + '">' + ICON.cat + '</div>' +
    '<h2>Purr-fect!</h2>' +
    '<p>You found all ' + G.n + ' cats.</p>' +
    miniHearts(G.lives) +
    '<div class="stack">' +
    '<button class="btn primary" data-act="next">Next level</button>' +
    '<button class="btn" data-act="levels">Choose level</button>' +
    '<button class="btn" data-act="retry">Play again</button>' +
    '</div>'
  );
}

function showLose() {
  openModal(
    '<h2>Out of lives</h2>' +
    '<p>The hidden cats are shown on the board. Try this level again.</p>' +
    '<div class="stack">' +
    '<button class="btn primary" data-act="retry">Try again</button>' +
    '<button class="btn" data-act="peek">View board</button>' +
    '<button class="btn" data-act="levels">Choose level</button>' +
    '</div>'
  );
}

function showHelp() {
  openModal(
    '<h2>How to play</h2><p>Find one hidden cat for every colour.</p>' +
    '<ul class="rules">' +
    '<li><span class="mini">' + ICON.cat + '</span><span>One cat in each colour territory.</span></li>' +
    '<li><span class="mini"><svg viewBox="0 0 24 24" fill="none" stroke="#231a3b" stroke-width="2.6" stroke-linecap="round"><path d="M4 8h16M4 16h16M8 4v16M16 4v16" opacity=".6"/></svg></span><span>One cat in every row and every column.</span></li>' +
    '<li><span class="mini"><svg viewBox="0 0 24 24" fill="none" stroke="#231a3b" stroke-width="2.6" stroke-linecap="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg></span><span>Cats never touch, even diagonally.</span></li>' +
    '<li><span class="mini">' + ICON.x + '</span><span>Tap a square to mark it empty. Tap again to clear it.</span></li>' +
    '<li><span class="mini">' + ICON.cat + '</span><span>Double-tap to place a cat. A wrong guess shows a red cross and costs a life. You have 3.</span></li>' +
    '</ul>' +
    '<div class="stack"><button class="btn primary" data-act="close">Start hunting</button></div>'
  );
  save.seenHelp = true; persist();
}

function showLevels(page) {
  const cur = G ? G.idx : 0;
  if (typeof page !== 'number') page = Math.floor(cur / PAGE);
  const first = page * PAGE;
  const chev = (d) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="' + d + '"/></svg>';
  let h = '<h2>Levels</h2><div class="pager">' +
    '<button class="icon-btn" data-act="page" data-page="' + (page - 1) + '"' + (page === 0 ? ' disabled' : '') + ' aria-label="Earlier levels">' + chev('M15 5l-7 7 7 7') + '</button>' +
    '<span>' + (first + 1) + '–' + (first + PAGE) + '</span>' +
    '<button class="icon-btn" data-act="page" data-page="' + (page + 1) + '" aria-label="Later levels">' + chev('M9 5l7 7-7 7') + '</button>' +
    '</div><div class="levels">';
  for (let i = first; i < first + PAGE; i++) {
    const n = levelSize(i);
    const done = Object.prototype.hasOwnProperty.call(save.done, i);
    h += '<button class="lv' + (done ? ' done' : '') + (i === cur ? ' cur' : '') + '" data-act="pick" data-level="' + i + '" aria-label="Level ' + (i + 1) + ', ' + n + ' by ' + n + (done ? ', completed' : '') + '">' +
      (done ? '<span class="ok">' + ICON.tick + '</span>' : '') +
      '<b>' + (i + 1) + '</b><small>' + n + '×' + n + '</small>' +
      '<span class="mh">' + (done ? [0, 1, 2].map((k) => '<span class="' + (k >= save.done[i] ? 'lost' : '') + '">' + ICON.heart + '</span>').join('') : '') + '</span>' +
      '</button>';
  }
  h += '</div><div class="stack"><button class="btn" data-act="close">Close</button></div>';
  openModal(h);
}

/* ---------- modal plumbing ---------- */
function openModal(html) {
  scrim.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + html + '</div>';
  scrim.classList.add('open');
}
function closeModal() { scrim.classList.remove('open'); scrim.innerHTML = ''; }

scrim.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]');
  if (!a) { if (e.target === scrim && wanted === null) closeModal(); return; }
  const act = a.dataset.act;
  if (act === 'close' || act === 'peek') closeModal();
  else if (act === 'next') loadLevel(G.idx + 1);
  else if (act === 'retry') loadLevel(G.idx);
  else if (act === 'levels') showLevels();
  else if (act === 'page') showLevels(+a.dataset.page);
  else if (act === 'pick') loadLevel(+a.dataset.level);
  else if (act === 'cancelload') {
    wanted = null; clearTimeout(loadTimer);
    if (G) closeModal(); else startLevel(0, getLevel(0));
  }
});

/* ---------- chrome buttons ---------- */
$('#btnLevels').addEventListener('click', showLevels);
$('#btnMusic').addEventListener('click', () => setMusic(!musicOn, true));
$('#btnSfx').addEventListener('click', () => setSfx(!sfxOn));
$('#btnHelp').addEventListener('click', showHelp);
$('#btnRestart').addEventListener('click', () => {
  const label = $('#restartLabel');
  const busy = G.found.size > 0 || G.lives < MAX_LIVES || G.cells.some((s) => s === 'x');
  if (busy && !G.over && !G.won && !restartTimer) {
    label.textContent = 'Confirm?';
    restartTimer = setTimeout(() => { label.textContent = 'Restart'; restartTimer = 0; }, 2200);
    return;
  }
  clearTimeout(restartTimer); restartTimer = 0; label.textContent = 'Restart';
  loadLevel(G.idx);
});
$('#boardWrap').addEventListener('scroll', updateEdges, { passive: true });
window.addEventListener('resize', updateEdges);
$('#btnZoom').addEventListener('click', () => {
  G.zoom = (G.zoom + 1) % ZOOMS.length;
  applyZoom(false);
});
$('#btnAuto').addEventListener('click', () => {
  save.auto = !save.auto; persist();
  $('#btnAuto').setAttribute('aria-pressed', String(save.auto));
});

/* ---------- boot ---------- */
for (const k of Object.keys(BANK)) BANK[k] = BANK[k].filter((p) => contiguous(+k, unb36(p.reg)));
$('#miniX').innerHTML = ICON.x;
$('#miniCat').innerHTML = ICON.cat;
$('#btnAuto').setAttribute('aria-pressed', String(!!save.auto));
setMusic(musicOn, false);
setSfx(sfxOn);
{
  const first = Math.max(0, save.level || 0);
  if (getLevel(first)) startLevel(first, getLevel(first));
  else { startLevel(0, getLevel(0)); loadLevel(first); }
}
if (!save.seenHelp) showHelp();
</script>
</body>
</html>
